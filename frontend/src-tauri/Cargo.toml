[package]
name = "ink-readable"
version = "0.1.1"
description = "Ink & Readable — a calm, keyboard-first home for your Markdown notes"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ink_readable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.53.3", features = ["time"] }
