services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    volumes:
      - ./backend/migrations:/migrations:ro
      - sqlite_data:/app/data
    command:
      - "-path=/migrations"
      - "-database=sqlite:///app/data/ink-readable.db"
      - "up"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    env_file:
      - ./backend/.env
    environment:
      VAULT_URL: ${VAULT_URL:-http://host.docker.internal:8080}
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sqlite_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  sqlite_data:
