version: "2"

sql:
  - engine: "sqlite"
    queries:
      - "internal/sqlc/queries/vaults"
      - "internal/sqlc/queries/documents"
      - "internal/sqlc/queries/projects"
      - "internal/sqlc/queries/tasks"
      - "internal/sqlc/queries/editorconfig"
    schema: "migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/sqlc/generated"
